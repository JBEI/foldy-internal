[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
strict_optional = True

# For imports between modules
[mypy.plugins.flask_sqlalchemy]
follow_imports = silent

[mypy.plugins.sqlalchemy.ext.declarative.api]
ignore_missing_imports = True

[mypy.plugins.sqlalchemy.orm]
ignore_missing_imports = True

[mypy.plugins.flask.*]
ignore_missing_imports = True

# Common external packages
[mypy-flask_admin.*]
ignore_missing_imports = True

[mypy-flask_migrate.*]
ignore_missing_imports = True

[mypy-flask_rq2.*]
ignore_missing_imports = True

[mypy-flask_compress.*]
ignore_missing_imports = True

[mypy-flask_restx.*]
ignore_missing_imports = True

[mypy-flask_jwt_extended.*]
ignore_missing_imports = True

[mypy-rq_dashboard.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-wtforms.*]
ignore_missing_imports = True

[mypy-premailer.*]
ignore_missing_imports = True

[mypy-jwt.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

# ML-related packages
[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-peft.*]
ignore_missing_imports = True

[mypy-esm.*]
ignore_missing_imports = True

[mypy-huggingface_hub.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-evaluate.*]
ignore_missing_imports = True

[mypy-dnachisel.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-rq.*]
ignore_missing_imports = True

# Internal modules
[mypy-app.*]
ignore_missing_imports = True

[mypy-app.extensions.*]
ignore_missing_imports = True

[mypy-app.views.*]
ignore_missing_imports = True

# Specific problematic files
[mypy-app.helpers.fold_storage_manager]
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
disallow_any_generics = False
disallow_subclassing_any = False
