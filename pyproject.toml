[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pyright]
pythonVersion = "3.12"
include = ["backend/src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
useLibraryCodeForTypes = true
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalCall = false
reportOptionalIterable = false
reportOptionalContextManager = false
reportOptionalOperand = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

# Test-specific settings - more permissive
[[tool.pyright.overrides]]
files = ["backend/src/**/tests/**", "backend/src/**/test_*.py"]
reportUnknownMemberType = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportArgumentType = false

# Handle pandas-specific issues in data-heavy modules
[[tool.pyright.overrides]]
files = ["backend/src/folde/few_shot_models.py", "backend/src/folde/util.py"]
reportArgumentType = false
reportCallIssue = false
